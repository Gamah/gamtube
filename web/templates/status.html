<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="refresh" content="30;url=/v/{{ short_id }}">
<title>Processing</title>
<link rel="icon" type="image/svg+xml" href="/static/awesome_face.svg">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: system-ui, sans-serif;
  background: #111;
  color: #bbb;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  gap: 1rem;
}
#status-text { font-size: .95rem; }
#bar-wrap {
  width: 260px;
  height: 5px;
  background: #2a2a2a;
  border-radius: 3px;
  overflow: hidden;
}
#bar-fill {
  height: 100%;
  width: 0%;
  background: #5af;
  border-radius: 3px;
  transition: width .4s ease;
}
@keyframes sweep {
  0%   { background-position: -260px 0; }
  100% { background-position: 260px 0; }
}
#bar-fill.indeterminate {
  width: 100%;
  background: linear-gradient(90deg, #2af 0%, #5cf 40%, #aef 50%, #5cf 60%, #2af 100%);
  background-size: 520px 100%;
  animation: sweep 1.4s linear infinite;
  transition: none;
}
#bmc {
  margin-top: .5rem;
  font-size: .78rem;
  color: #555;
}
#bmc a { color: #7a6000; text-decoration: none; }
#bmc a:hover { text-decoration: underline; color: #ffdd57; }
</style>
</head>
<body>
<p id="status-text">{{ status }}</p>
<div id="bar-wrap"><div id="bar-fill"></div></div>
<p id="bmc">too slow? <a href="https://buymeacoffee.com/gamah" target="_blank" rel="noopener">☕ bribe the hamster</a> running the servers.</p>
<script>
(function () {
  if (!window.EventSource) return;

  var statusEl = document.getElementById('status-text');
  var fillEl = document.getElementById('bar-fill');
  var shortId = '{{ short_id }}';
  var labels = { pending: 'Queued…', downloading: 'Downloading…', transcoding: 'Transcoding…', ready: 'Done!' };
  var labelsIndeterminate = { downloading: 'Merging…', transcoding: 'Transcoding…' };

  var src = new EventSource('/v/' + shortId + '/progress');

  src.onmessage = function (e) {
    var d = JSON.parse(e.data);
    var indeterminate = d.pct === null || d.pct === undefined;
    statusEl.textContent = indeterminate
      ? (labelsIndeterminate[d.stage] || labels[d.stage] || d.stage)
      : (labels[d.stage] || d.stage);
    if (indeterminate) {
      fillEl.classList.add('indeterminate');
    } else {
      fillEl.classList.remove('indeterminate');
      fillEl.style.width = d.pct.toFixed(1) + '%';
    }
    if (d.stage === 'ready') {
      src.close();
      window.location.href = '/v/' + shortId;
    } else if (d.stage === 'error') {
      src.close();
      window.location.reload();
    }
  };

  src.onerror = function () { src.close(); };
}());
</script>
</body>
</html>
