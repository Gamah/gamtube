<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Submit</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<form id="form">
  <input type="text" id="key" placeholder="API key" autocomplete="off" spellcheck="false">
  <input type="url" id="url" placeholder="Paste video URL" required autofocus>
  <button type="submit">Submit</button>
</form>
<div id="result"></div>
<script>
const keyEl = document.getElementById('key');
const urlEl = document.getElementById('url');
const resultEl = document.getElementById('result');

keyEl.value = localStorage.getItem('apiKey') || '';

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const key = keyEl.value.trim();
  const url = urlEl.value.trim();
  if (key) localStorage.setItem('apiKey', key);
  resultEl.textContent = 'Submitting…';
  try {
    const res = await fetch('/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-API-Key': key },
      body: JSON.stringify({ url }),
    });
    const data = await res.json();
    if (res.ok) {
      resultEl.innerHTML = '<a href="' + data.url + '">' + data.url + '</a>';
    } else {
      resultEl.textContent = data.detail || 'Error ' + res.status;
    }
  } catch {
    resultEl.textContent = 'Network error';
  }
});
</script>
</body>
</html>
