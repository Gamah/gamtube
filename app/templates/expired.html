<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Expired</title>
<link rel="icon" type="image/svg+xml" href="/static/awesome_face.svg">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }

#frame {
  position: relative;
  width: min(90vw, 640px);
}

.thumb {
  display: block;
  width: 100%;
  aspect-ratio: 16/9;
  object-fit: cover;
  border-radius: 8px;
  opacity: .3;
}

.placeholder {
  width: 100%;
  aspect-ratio: 16/9;
  background: #111;
  border-radius: 8px;
}

.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1rem;
}

.x-icon { width: 60px; height: 60px; }

.label { color: #aaa; font-size: .9rem; }

.rerequest-btn {
  padding: .45rem 1.3rem;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.18);
  border-radius: 6px;
  color: #ccc;
  font-size: .85rem;
  cursor: pointer;
  transition: background .15s, color .15s;
}
.rerequest-btn:hover { background: rgba(255,255,255,.18); color: #fff; }
</style>
</head>
<body>
<div id="frame">
  {% if thumbnail_url %}
  <img class="thumb" src="{{ thumbnail_url }}" alt="">
  {% else %}
  <div class="placeholder"></div>
  {% endif %}
  <div class="overlay">
    <svg class="x-icon" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="30" cy="30" r="28" stroke="#e53e3e" stroke-width="2.5" fill="rgba(229,62,62,.12)"/>
      <line x1="19" y1="19" x2="41" y2="41" stroke="#e53e3e" stroke-width="3" stroke-linecap="round"/>
      <line x1="41" y1="19" x2="19" y2="41" stroke="#e53e3e" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <span class="label">This video has expired.</span>
    <form method="POST" action="/v/{{ short_id }}/rerequest">
      <button class="rerequest-btn" type="submit">Re-request</button>
    </form>
  </div>
</div>
</body>
</html>
