<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="refresh" content="30;url=/v/{{ short_id }}">
<title>Processing</title>
<link rel="icon" type="image/svg+xml" href="/static/awesome_face.svg">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: system-ui, sans-serif;
  background: #111;
  color: #bbb;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  gap: 1rem;
}
#status-text { font-size: .95rem; }
#bar-wrap {
  width: 260px;
  height: 5px;
  background: #2a2a2a;
  border-radius: 3px;
  overflow: hidden;
}
#bar-fill {
  height: 100%;
  width: 0%;
  background: #5af;
  border-radius: 3px;
  transition: width .4s ease;
}
</style>
</head>
<body>
<p id="status-text">{{ status }}</p>
<div id="bar-wrap"><div id="bar-fill"></div></div>
<script>
(function () {
  if (!window.EventSource) return;

  var statusEl = document.getElementById('status-text');
  var fillEl = document.getElementById('bar-fill');
  var shortId = '{{ short_id }}';
  var labels = { pending: 'Queued…', downloading: 'Downloading…', transcoding: 'Transcoding…', ready: 'Done!' };

  var src = new EventSource('/v/' + shortId + '/progress');

  src.onmessage = function (e) {
    var d = JSON.parse(e.data);
    statusEl.textContent = labels[d.stage] || d.stage;
    if (d.pct !== null && d.pct !== undefined) {
      fillEl.style.width = d.pct.toFixed(1) + '%';
    }
    if (d.stage === 'ready') {
      src.close();
      window.location.href = '/v/' + shortId;
    } else if (d.stage === 'error') {
      src.close();
      window.location.reload();
    }
  };

  src.onerror = function () { src.close(); };
}());
</script>
</body>
</html>
